# Backend environments for scripts/bench.py. Each benchmark backend is a one-shot service whose
# entrypoint is scripts/execute.py; the host launcher mounts its selected run directory at /outputs.

x-runner-environment: &runner-environment
  HF_HOME: /models
  HF_HUB_CACHE: /models/hub
  HF_TOKEN: ${HF_TOKEN:-}
  HF_HUB_OFFLINE: ${HF_HUB_OFFLINE:-0}
  TRANSFORMERS_OFFLINE: ${TRANSFORMERS_OFFLINE:-0}
  PYTHONPATH: /workspace

x-gpu-environment: &gpu-environment
  <<: *runner-environment
  CUDA_VISIBLE_DEVICES: ${CUDA_VISIBLE_DEVICES:-0}

x-runner: &runner
  working_dir: /workspace
  entrypoint: ["python3", "/workspace/scripts/execute.py"]
  volumes:
    - ..:/workspace:ro
    - model-cache:/models
  shm_size: "8gb"

x-vllm-build: &vllm-build
  context: .
  dockerfile: Dockerfile

services:
  hf:
    <<: *runner
    entrypoint: ["python3", "/workspace/scripts/execute.py", "--engine", "transformers"]
    image: nnbench-hf:local
    build:
      context: .
      dockerfile: Dockerfile.hf
    environment: *gpu-environment
    gpus: all

  vllm_async:
    <<: *runner
    entrypoint: ["python3", "/workspace/scripts/execute.py", "--engine", "vllm"]
    image: nnbench-vllm:local
    build: *vllm-build
    environment: *gpu-environment
    gpus: all

  vllm_sync:
    <<: *runner
    entrypoint: ["python3", "/workspace/scripts/execute.py", "--engine", "vllm", "--engine-mode", "sync"]
    image: nnbench-vllm:local
    build: *vllm-build
    environment: *gpu-environment
    gpus: all

  # GPU-less client for an already-running nnsight vLLM serve endpoint. For the bundled server
  # below, pass --serve http://server:6677 while it is running on this Compose network.
  vllm_serve:
    <<: *runner
    entrypoint: ["python3", "/workspace/scripts/execute.py", "--engine", "vllm", "--deployment", "serve"]
    image: nnbench-vllm:local
    build: *vllm-build
    environment:
      <<: *runner-environment
      NVIDIA_VISIBLE_DEVICES: void

  # Optional provider for vllm_serve. It stays on the private Compose network: port 6677 is not
  # published to the host because the endpoint executes serialized nnsight requests.
  server:
    image: nnbench-vllm:local
    build: *vllm-build
    entrypoint: ["python3", "-m", "nnsight.modeling.vllm.serve.cli"]
    command:
      - ${MODEL:-openai-community/gpt2}
      - --host
      - 0.0.0.0
      - --port
      - "6677"
      - --gpu-memory-utilization
      - ${GPU_MEMORY_UTILIZATION:-0.3}
      - --dtype
      - ${DTYPE:-auto}
    environment: *gpu-environment
    volumes:
      - model-cache:/models
    shm_size: "8gb"
    gpus: all
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://localhost:6677/health')\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 40
      start_period: 30s

volumes:
  model-cache:
