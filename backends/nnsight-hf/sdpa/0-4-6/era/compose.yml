services:
  runner:
    image: isb-nnsight-hf-0-4-6-era:local
    build:
      context: ../../..
      args:
        PYTORCH_IMAGE: pytorch/pytorch:2.6.0-cuda12.4-cudnn9-runtime
        NNSIGHT_REF: a5bbbace8a4fe48eef5ce52a63723bbd16c23b89   # tag v0.4.6 (2025-04-24)
        TORCH_VERSION: 2.6.0
        TRANSFORMERS_VERSION: 4.51.3   # the release current with 0.4.6
        ACCELERATE_VERSION: 1.6.0
    working_dir: /workspace
    entrypoint: [python3, -m, isb.jobs.entry]
    user: "${ISB_UID:-1000}:${ISB_GID:-1000}"
    shm_size: 8gb
    environment:
      PYTHONPATH: /workspace
      PYTHONDONTWRITEBYTECODE: "1"
      USER: isb
      XDG_CACHE_HOME: /tmp/cache
      TORCHINDUCTOR_CACHE_DIR: /tmp/torchinductor
      TRITON_CACHE_DIR: /tmp/triton
      HF_HOME: /models
      HF_HUB_CACHE: /models/hub
      HF_TOKEN: ${HF_TOKEN:-}
      HF_HUB_OFFLINE: ${HF_HUB_OFFLINE:-0}
      TRANSFORMERS_OFFLINE: ${TRANSFORMERS_OFFLINE:-0}
      ISB_BACKEND: ${ISB_BACKEND:-nnsight-hf/sdpa/0-4-6/era}
      # transformers' default attention (sdpa) in bf16, for timing against vLLM
      ISB_ENGINE_OPTIONS: '{"dtype":"bfloat16","attn_implementation":"sdpa"}'
    volumes:
      - ../../../../..:/workspace:ro
      - ${ISB_JOB_DIR:-../../../../../runs/manual/job}:/job:ro
      - ${ISB_OUTPUT_DIR:-../../../../../runs/manual/output}:/output
      - model-cache:/models
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["${ISB_GPU:-0}"]
              capabilities: [gpu]
volumes:
  model-cache:
    name: ${ISB_MODEL_CACHE:-isb-model-cache}
