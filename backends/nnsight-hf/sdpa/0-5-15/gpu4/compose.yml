services:
  runner:
    extends: {file: ../../../compose.base.yml, service: runner}
    image: isb-nnsight-hf-0-5-15:local
    build:
      args:
        NNSIGHT_REF: 79e18487ee86c96712df7561acf4a9ddb8469098   # tag v0.5.15 (2026-01-13)
    environment:
      ISB_BACKEND: ${ISB_BACKEND:-nnsight-hf/sdpa/0-5-15/gpu4}
      # sdpa in bf16 with accelerate's device_map="auto": the layers split across four GPUs
      # and run one GPU after the other, transformers' own multi-GPU loading
      ISB_ENGINE_OPTIONS: '{"dtype":"bfloat16","attn_implementation":"sdpa","device_map":"auto"}'
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["${ISB_GPU}", "${ISB_GPU_1}", "${ISB_GPU_2}", "${ISB_GPU_3}"]   # four GPUs from --gpu (backends/README.md)
              capabilities: [gpu]
volumes:
  model-cache:
    name: ${ISB_MODEL_CACHE:-isb-model-cache}
