services:
  runner:
    extends: {file: ../../compose.base.yml, service: runner}
    image: isb-nnsight-hf-0-5-15:local
    build:
      args:
        NNSIGHT_REF: 79e18487ee86c96712df7561acf4a9ddb8469098   # tag v0.5.15 (2026-01-13)
    environment:
      ISB_BACKEND: ${ISB_BACKEND:-nnsight-hf/sdpa/0-5-15}
      # transformers' default attention (sdpa) in bf16, for timing against vLLM
      ISB_ENGINE_OPTIONS: '{"dtype":"bfloat16","attn_implementation":"sdpa"}'
volumes:
  model-cache:
    name: ${ISB_MODEL_CACHE:-isb-model-cache}
