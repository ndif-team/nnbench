services:
  runner:
    extends: {file: ../compose.base.yml, service: runner}
    environment:
      ISB_BACKEND: ${ISB_BACKEND:-nnsight-hf/sdpa}
      # transformers' default attention (sdpa) in bf16, for timing against vLLM
      ISB_ENGINE_OPTIONS: '{"dtype":"bfloat16","attn_implementation":"sdpa"}'
volumes:
  model-cache:
    name: ${ISB_MODEL_CACHE:-isb-model-cache}
