# TransformerLens 4.0 bridging vLLM 0.20.2 (the Dockerfile's ARG values). `mode: opt` selects the
# GPU-readout realization (cells_opt.py). `batched` boots the eager batched path
# (`enable_batching`: enforce_eager, every unit of a call in one forward), which refuses position
# interventions and tensor parallelism (source.py, boot_vllm); the `opt/tp*` configs therefore shard
# the compiled single-prompt path.
images:
  default: {}
configs:
  default:
    image: default
    options: &base {dtype: bfloat16, gpu_memory_utilization: 0.85, enable_position_interventions: true}
  fp32: {image: default, options: {<<: *base, dtype: float32}}
  opt: {image: default, options: {<<: *base, mode: opt}}
  batched: {image: default, options: {dtype: bfloat16, gpu_memory_utilization: 0.85,
                                      enable_batching: true, enable_position_interventions: false}}
  # Position interventions widen every hook's scale/bias buffers to (max_num_batched_tokens, width)
  # (source.py, ~2x the hooks' resident memory), which vLLM's memory profiling does not count: at
  # qwen3-32b TP2 the 0.85 budget runs out while capturing CUDA graphs, and at llama3.3-70b TP4
  # (wider hooks, more layers) 0.70 runs out while warming up the sampler. The sharded configs
  # leave that memory outside the engine budget.
  tp2: {image: default, options: {<<: *base, gpu_memory_utilization: 0.70, tensor_parallel_size: 2}, gpus: 2}
  tp4: {image: default, options: {<<: *base, gpu_memory_utilization: 0.55, tensor_parallel_size: 4}, gpus: 4}
  opt/tp2: {image: default, options: {<<: *base, mode: opt, gpu_memory_utilization: 0.70, tensor_parallel_size: 2}, gpus: 2}
  opt/tp4: {image: default, options: {<<: *base, mode: opt, gpu_memory_utilization: 0.55, tensor_parallel_size: 4}, gpus: 4}
