services:
  runner:
    extends: {file: ../../../compose.base.yml, service: runner}
    image: isb-nnsight-vllm-0-5-15:local
    build:
      args:
        VLLM_IMAGE: vllm/vllm-openai:v0.13.0
        NNSIGHT_REF: 79e18487ee86c96712df7561acf4a9ddb8469098   # tag v0.5.15 (2026-01-13)
    environment:
      ISB_BACKEND: ${ISB_BACKEND:-nnsight-vllm/sync/0-5-15/tp4}
      # sync/0-5-15 with tensor parallelism over four GPUs
      ISB_ENGINE_OPTIONS: '{"dtype":"bfloat16","gpu_memory_utilization":0.85,"enable_prefix_caching":false,"tensor_parallel_size":4}'
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["${ISB_GPU}", "${ISB_GPU_1}", "${ISB_GPU_2}", "${ISB_GPU_3}"]   # four GPUs from --gpu (backends/README.md)
              capabilities: [gpu]
volumes:
  model-cache:
    name: ${ISB_MODEL_CACHE:-isb-model-cache}
