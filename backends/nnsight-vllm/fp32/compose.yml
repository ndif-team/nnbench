services:
  runner:
    extends: {file: ../compose.base.yml, service: runner}
    environment:
      ISB_BACKEND: ${ISB_BACKEND:-nnsight-vllm/fp32}
      ISB_ENGINE_OPTIONS: '{"dtype":"float32","gpu_memory_utilization":0.85,"enable_prefix_caching":false}'
volumes:
  model-cache:
    name: ${ISB_MODEL_CACHE:-isb-model-cache}
