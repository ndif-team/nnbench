services:
  runner:
    extends: {file: ../../compose.base.yml, service: runner}
    image: isb-nnsight-vllm-0-28-0:local
    build:
      args:
        # taps need vLLM's breakable CUDA graphs (vllm.compilation.breakable_cudagraph), absent in 0.19.1
        VLLM_IMAGE: vllm/vllm-openai:v0.28.0
    environment:
      ISB_BACKEND: ${ISB_BACKEND:-nnsight-vllm/opt/taps}
      ISB_ENGINE_OPTIONS: '{"dtype":"bfloat16","gpu_memory_utilization":0.85,"enable_prefix_caching":false,"taps":"auto"}'
volumes:
  model-cache:
    name: ${ISB_MODEL_CACHE:-isb-model-cache}
