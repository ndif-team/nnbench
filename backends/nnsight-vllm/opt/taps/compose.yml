services:
  runner:
    image: isb-nnsight-vllm-0-28-0:local
    build:
      context: ../..
      args:
        # taps need vLLM's breakable CUDA graphs (vllm.compilation.breakable_cudagraph), absent in 0.19.1
        VLLM_IMAGE: vllm/vllm-openai:v0.28.0
    working_dir: /workspace
    entrypoint: [python3, -m, isb.jobs.entry]
    user: "${ISB_UID:-1000}:${ISB_GID:-1000}"
    shm_size: 8gb
    environment:
      PYTHONPATH: /workspace
      PYTHONDONTWRITEBYTECODE: "1"
      USER: isb
      XDG_CACHE_HOME: /tmp/cache
      TORCHINDUCTOR_CACHE_DIR: /tmp/torchinductor
      TRITON_CACHE_DIR: /tmp/triton
      FLASHINFER_WORKSPACE_BASE: /tmp
      HF_HOME: /models
      HF_HUB_CACHE: /models/hub
      HF_TOKEN: ${HF_TOKEN:-}
      HF_HUB_OFFLINE: ${HF_HUB_OFFLINE:-0}
      TRANSFORMERS_OFFLINE: ${TRANSFORMERS_OFFLINE:-0}
      VLLM_CACHE_ROOT: /tmp/vllm
      ISB_BACKEND: ${ISB_BACKEND:-nnsight-vllm/opt/taps}
      ISB_ENGINE_OPTIONS: '{"dtype":"bfloat16","gpu_memory_utilization":0.85,"enable_prefix_caching":false,"taps":"auto"}'
    volumes:
      - ../../../..:/workspace:ro
      - ${ISB_JOB_DIR:-../../../../runs/manual/job}:/job:ro
      - ${ISB_OUTPUT_DIR:-../../../../runs/manual/output}:/output
      - model-cache:/models
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["${ISB_GPU:-0}"]
              capabilities: [gpu]
volumes:
  model-cache:
    name: ${ISB_MODEL_CACHE:-isb-model-cache}
