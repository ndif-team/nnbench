services:
  runner:
    extends: {file: ../../compose.base.yml, service: runner}
    image: isb-vllm-plain-0-27-1:local
    build:
      args:
        VLLM_IMAGE: vllm/vllm-openai:v0.27.1
    environment:
      # plain vLLM 0.27.1 compiled, tensor parallel over four GPUs: the engine nnsight 0.8.1 runs on
      ISB_ENGINE_OPTIONS: '{"dtype":"bfloat16","gpu_memory_utilization":0.85,"enable_prefix_caching":false,"enforce_eager":false,"tensor_parallel_size":4}'
      ISB_BACKEND: ${ISB_BACKEND:-vllm-plain/0-27-1/tp4}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["${ISB_GPU}", "${ISB_GPU_1}", "${ISB_GPU_2}", "${ISB_GPU_3}"]   # four GPUs from --gpu (backends/README.md)
              capabilities: [gpu]
volumes:
  model-cache:
    name: ${ISB_MODEL_CACHE:-isb-model-cache}
