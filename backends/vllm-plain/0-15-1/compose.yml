services:
  runner:
    extends: {file: ../compose.base.yml, service: runner}
    image: isb-vllm-plain-0-15-1:local
    build:
      args:
        VLLM_IMAGE: vllm/vllm-openai:v0.15.1
    environment:
      ISB_BACKEND: ${ISB_BACKEND:-vllm-plain/0-15-1}
volumes:
  model-cache:
    name: ${ISB_MODEL_CACHE:-isb-model-cache}
