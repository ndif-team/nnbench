services:
  runner:
    extends: {file: ../compose.base.yml, service: runner}
    image: isb-vllm-plain-0-20-2:local
    build:
      args:
        VLLM_IMAGE: vllm/vllm-openai:v0.20.2
    environment:
      ISB_BACKEND: ${ISB_BACKEND:-vllm-plain/eager-0-20-2}
      ISB_ENGINE_OPTIONS: '{"dtype":"bfloat16","gpu_memory_utilization":0.85,"enable_prefix_caching":false,"enforce_eager":true}'
volumes:
  model-cache:
    name: ${ISB_MODEL_CACHE:-isb-model-cache}
