services:
  runner:
    image: isb-nnsight-vllm-0-7:local
    build:
      context: ../nnsight-vllm
      args:
        # nnsight 0.7 is validated on vLLM 0.15.1 (its docs/models/vllm.md and ray example)
        VLLM_IMAGE: vllm/vllm-openai:v0.15.1
        NNSIGHT_REF: 884bd1c7b0dbd53be01ade6a18843078d90367b4   # tag v0.7.0
    working_dir: /workspace
    entrypoint: [python3, /backend/run.py]
    user: "${ISB_UID:-1000}:${ISB_GID:-1000}"
    shm_size: 8gb
    environment:
      PYTHONPATH: /workspace
      PYTHONDONTWRITEBYTECODE: "1"
      USER: isb
      XDG_CACHE_HOME: /tmp/cache
      TORCHINDUCTOR_CACHE_DIR: /tmp/torchinductor
      TRITON_CACHE_DIR: /tmp/triton
      FLASHINFER_WORKSPACE_BASE: /tmp
      HF_HOME: /models
      HF_HUB_CACHE: /models/hub
      HF_TOKEN: ${HF_TOKEN:-}
      HF_HUB_OFFLINE: ${HF_HUB_OFFLINE:-0}
      TRANSFORMERS_OFFLINE: ${TRANSFORMERS_OFFLINE:-0}
      VLLM_CACHE_ROOT: /tmp/vllm
      ISB_BACKEND: ${ISB_BACKEND:-nnsight-vllm-0-7}
      # nnsight 0.7's VLLM_GUIDE.md says nnsight disables prefix caching, but 0.7 leaves vLLM's default
      # (on) and its traces read the cache, so a repeated 17+-token prompt skips hooks on the cached
      # prefix. 0.8 sets skip_reading_prefix_cache per trace. Run 0.7 in its documented form.
      ISB_ENGINE_OPTIONS: '{"dtype":"bfloat16","gpu_memory_utilization":0.85,"enable_prefix_caching":false}'
    volumes:
      - ../..:/workspace:ro
      - ../nnsight-vllm:/backend:ro
      - ${ISB_JOB_DIR:-../../runs/manual/job}:/job:ro
      - ${ISB_OUTPUT_DIR:-../../runs/manual/output}:/output
      - model-cache:/models
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["${ISB_GPU:-0}"]
              capabilities: [gpu]
volumes:
  model-cache:
    name: ${ISB_MODEL_CACHE:-isb-model-cache}
